<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Acciparte Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Aviso premium para resoluciones menores a 1024px -->
    <div id="desktop-only-warning">
      <div class="warning-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="warning-icon"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
        <h2>Resolución no compatible</h2>
        <p>Esta plataforma y su editor de croquis viales están diseñados exclusivamente para pantallas de más de <strong>1024px</strong> (ordenadores o portátiles).</p>
        <p class="secondary-text">Por favor, accede desde un dispositivo de escritorio para visualizar y administrar la reconstrucción de incidentes.</p>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
